name: Clips musique

# Lancement à la demande : Actions > « Clips musique » > Run workflow (aussi depuis l'appli GitHub).
# Dépôt public = minutes GitHub Actions gratuites et illimitées ; les données restent dans le dépôt privé.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode : base (ta vidéo + extraits) | react | clip | video | son | lifestyle"
        type: choice
        options: [base, react, clip, video, son, lifestyle]
        default: base
      source:
        description: "Fichier du son ou de la vidéo (Release « sons » ou « entrees »), ex. rk_mon-son.mp3"
        required: false
        default: ""
      artiste:
        description: "Clé de l'artiste (ex. rk, lafouine, timar)"
        required: false
        default: ""
      titre:
        description: "Titre du son"
        required: false
        default: ""
      nb_clips:
        description: "Nombre de clips"
        default: "4"
      duree:
        description: "Durée (s), ex. 15-30"
        default: "15-30"
      texte:
        description: "Texte sur la vidéo"
        type: choice
        options: [tout, paroles, accroche, perso, aucun]
        default: tout
      visuels:
        description: "Visuels (banque = vidéos de l'artiste + générale)"
        type: choice
        options: [banque, artiste, generale, reacts, tout, pexels, clip_artiste]
        default: banque
      options:
        description: "Avancé : --paroles x.lrc --debut 1:12 --fin 1:40 --react x.mp4 --clip x.mp4 --tags nuit --texte-perso \"…\""
        default: ""
      demo:
        description: "Mode démo (aucun fichier)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: musique-donnees
  cancel-in-progress: false

env:
  DEPOT_DONNEES: humanabconsulting-bit/clipping-musique-donnees
  DONNEES: donnees
  GH_REPO: humanabconsulting-bit/clipping-musique-donnees
  GH_TOKEN: ${{ secrets.DONNEES_TOKEN }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  I_MODE: ${{ inputs.mode }}
  I_SOURCE: ${{ inputs.source }}
  I_ARTISTE: ${{ inputs.artiste }}
  I_TITRE: ${{ inputs.titre }}
  I_NB: ${{ inputs.nb_clips }}
  I_DUREE: ${{ inputs.duree }}
  I_TEXTE: ${{ inputs.texte }}
  I_VISUELS: ${{ inputs.visuels }}
  OPTIONS_SUPP: ${{ inputs.options }}
  MODE_DEMO: ${{ inputs.demo }}

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: "📥 Code"
        uses: actions/checkout@v4
      - uses: ./.github/actions/preparer
        with:
          jeton: ${{ secrets.DONNEES_TOKEN }}

      - name: "🔎 1. Analyse du morceau + choix des passages"
        run: |
          VIS=""; case "$I_MODE" in son|lifestyle|react|base) VIS="$I_VISUELS";; esac
          python -m musique.run recherche --mode "$I_MODE" --source "$I_SOURCE" --artiste "$I_ARTISTE" \
            --titre "$I_TITRE" --nb "$I_NB" --duree "$I_DUREE" --texte "$I_TEXTE" ${VIS:+--visuels "$VIS"} \
            $( [ "$MODE_DEMO" = "true" ] && echo --demo )

      - name: "🎬 2. Montage vertical + texte"
        run: python -m musique.run montage

      - name: "📤 3. Envoi des vidéos (Release privée)"
        run: python -m musique.run envoi

      - name: "📊 4. Sauvegarde des données"
        run: |
          cd donnees
          git config user.name "clipping-musique-bot"
          git config user.email "clipping-musique-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            (cd .. && python -m musique.run sauvegarde)
            git add data/
            git diff --cached --quiet && exit 0
            git commit -q -m "Clips musique : passage ${{ github.run_id }}"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 7))
          done
          exit 1

      - name: "🎞️ Aperçu (mode démo)"
        if: inputs.demo
        uses: actions/upload-artifact@v4
        with:
          name: clips-demo
          path: sortie/*.mp4
          retention-days: 3
