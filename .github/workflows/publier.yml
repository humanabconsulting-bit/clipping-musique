name: Publier (TikTok via Buffer)

# Toutes les 4 h : planifie les vidéos VALIDÉES puis les programme sur Buffer quelques heures avant leur créneau.
on:
  schedule:
    - cron: "37 1,5,9,13,17,21 * * *"
  workflow_dispatch:
    inputs:
      planning_seul:
        description: "Planning seulement (rien n'est envoyé)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: musique-donnees
  cancel-in-progress: false

env:
  DEPOT_DONNEES: humanabconsulting-bit/clipping-musique-donnees
  DONNEES: donnees
  GH_REPO: humanabconsulting-bit/clipping-musique-donnees
  GH_TOKEN: ${{ secrets.DONNEES_TOKEN }}
  BUFFER_API_KEY_MUSIQUE: ${{ secrets.BUFFER_API_KEY_MUSIQUE }}
  PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
  PLANNING_SEUL: ${{ inputs.planning_seul }}

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparer
        with:
          jeton: ${{ secrets.DONNEES_TOKEN }}
          lourd: "false"
      - name: "📅 Planning + 📤 programmation Buffer + 🧹 nettoyage"
        run: |
          if [ "$PLANNING_SEUL" = "true" ]; then python -m musique.publier planning; else python -m musique.publier; fi
      - name: "📊 Sauvegarde"
        env:
          MESSAGE: "Publications programmées"
        run: |
          cd donnees
          git config user.name "clipping-musique-bot"
          git config user.email "clipping-musique-bot@users.noreply.github.com"
          git add data/ && git diff --cached --quiet && exit 0
          git commit -q -m "$MESSAGE"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
